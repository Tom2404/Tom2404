name: Generate Contribution Snake

on:
  schedule:
    # Cập nhật tự động mỗi ngày lúc 00:00 UTC
    - cron: "0 0 * * *"

  # Cho phép chạy thủ công trong tab Actions
  workflow_dispatch:

  # Chạy lại khi cập nhật branch main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2358A6FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2358A6FF

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
